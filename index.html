<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flying Bird Game</title>
  <style>
    body {
      margin: 0;
      background: #70c5ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      position: relative;
    }
    canvas {
      background: #fff;
      border: 2px solid #333;
      width: 100%;
      max-width: 400px;
      height: auto;
      display: none;
    }
    #tapBtn, #restartBtn {
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 18px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      display: none;
    }
    #startScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #playerName {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #aaa;
    }
    #startBtn {
      padding: 10px 25px;
      font-size: 16px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Game over screen style */
    #gameOverScreen {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
      border-radius: 12px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      display: none;
    }
    #gameOverCard h2 {
      margin-top: 0;
      font-size: 28px;
      color: #ffeb3b;
    }
    #gameOverCard p {
      margin: 10px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <input type="text" id="playerName" placeholder="Masukkan nama kamu" />
  <button id="startBtn">Play</button>
</div>

<canvas id="game" width="400" height="500"></canvas>
<button id="tapBtn">Terbang!</button>
<button id="restartBtn">Main Lagi</button>

<!-- Game Over Screen -->
<div id="gameOverScreen">
  <div id="gameOverCard">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <p id="finalTime"></p>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird = {
  x: 50,
  y: 200,
  width: 30,
  height: 30,
  velocity: 0,
  image: new Image()
};

bird.image.src = "https://files.catbox.moe/703esa.png";
let pipeImage = new Image();
pipeImage.src = "https://files.catbox.moe/g4hnbg.png";
const gameOverSound = new Audio("https://files.catbox.moe/fzt75i.mp3");
gameOverSound.load();
gameOverSound.volume = 1.0;

let gravity = 0.5;
let lift = -1.5;
let isFlying = false;
let pipes = [];
let frame = 0;
let score = 0;
let gameOver = false;
let playerName = "";
let startTime = null;
let totalTime = 0;

function resetGame() {
  bird.y = 200;
  bird.velocity = 0;
  pipes = [];
  frame = 0;
  score = 0;
  gameOver = false;
  startTime = Date.now();
  document.getElementById("restartBtn").style.display = "none";
  document.getElementById("gameOverScreen").style.display = "none";
  update();
}

function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (isFlying) bird.velocity += lift;
  bird.velocity += gravity;
  bird.velocity *= 0.9;
  bird.y += bird.velocity;

  if (bird.y + bird.height > canvas.height || bird.y < 0) {
    endGame();
    return;
  }

  if (frame % 90 === 0) {
    let gap = 120;
    let top = Math.random() * (canvas.height - gap - 100);
    pipes.push({ x: canvas.width, y: top, width: 50, gap: gap });
  }

  for (let i = 0; i < pipes.length; i++) {
    let pipe = pipes[i];
    pipe.x -= 2;

    ctx.drawImage(pipeImage, pipe.x, 0, pipe.width, pipe.y);
    ctx.drawImage(pipeImage, pipe.x, pipe.y + pipe.gap, pipe.width, canvas.height - (pipe.y + pipe.gap));

    if (
      bird.x < pipe.x + pipe.width &&
      bird.x + bird.width > pipe.x &&
      (bird.y < pipe.y || bird.y + bird.height > pipe.y + pipe.gap)
    ) {
      endGame();
      return;
    }

    if (pipe.x + pipe.width < bird.x && !pipe.passed) {
      score++;
      pipe.passed = true;
    }
  }

  pipes = pipes.filter(p => p.x + p.width > 0);

  ctx.drawImage(bird.image, bird.x, bird.y, bird.width, bird.height);

  ctx.fillStyle = "#000";
  ctx.font = "18px Arial";
  ctx.fillText(`Score: ${score} (${playerName})`, 10, 25);

  frame++;
  requestAnimationFrame(update);
}

function endGame() {
  gameOver = true;
  gameOverSound.pause();
  gameOverSound.currentTime = 0;
  gameOverSound.play();

  totalTime = Math.floor((Date.now() - startTime) / 1000);

  document.getElementById("finalScore").textContent = `Score: ${score} (${playerName})`;
  document.getElementById("finalTime").textContent = `Waktu bermain: ${totalTime} detik`;
  document.getElementById("gameOverScreen").style.display = "block";
  document.getElementById("restartBtn").style.display = "inline-block";
}

document.getElementById("tapBtn").addEventListener("mousedown", () => isFlying = true);
document.getElementById("tapBtn").addEventListener("mouseup", () => isFlying = false);
document.getElementById("tapBtn").addEventListener("mouseleave", () => isFlying = false);
document.getElementById("tapBtn").addEventListener("touchstart", e => {
  e.preventDefault();
  isFlying = true;
});
document.getElementById("tapBtn").addEventListener("touchend", e => {
  e.preventDefault();
  isFlying = false;
});

canvas.addEventListener("touchstart", () => isFlying = true);
canvas.addEventListener("touchend", () => isFlying = false);

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "ArrowUp") isFlying = true;
});
document.addEventListener("keyup", e => {
  if (e.code === "Space" || e.key === "ArrowUp") isFlying = false;
});

document.getElementById("startBtn").addEventListener("click", () => {
  const nameInput = document.getElementById("playerName");
  if (!nameInput.value.trim()) {
    alert("Masukkan nama terlebih dahulu.");
    return;
  }

  playerName = nameInput.value.trim();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("game").style.display = "block";
  document.getElementById("tapBtn").style.display = "inline-block";

  resetGame();
});

document.getElementById("restartBtn").addEventListener("click", () => {
  resetGame();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flying Bird Game</title>
  <style>
    body {
      margin: 0;
      background: #70c5ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      background: #fff;
      border: 2px solid #333;
      width: 100%;
      max-width: 400px;
      height: auto;
    }
    #tapBtn {
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 18px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

<canvas id="game" width="400" height="500"></canvas>
<button id="tapBtn">Terbang!</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird = {
  x: 50,
  y: 200,
  width: 30,
  height: 30,
  velocity: 0,
  image: new Image()
};

bird.image.src = "https://files.catbox.moe/703esa.png";  // URL gambar burung

const gravity = 0.5;
const lift = -1.5;
let isFlying = false;
let pipes = [];
let frame = 0;
let score = 0;
let gameOver = false;

const gameOverSound = new Audio("https://files.catbox.moe/fzt75i.mp3");  // Suara game over

let pipeImage = new Image();
pipeImage.src = "https://files.catbox.moe/g4hnbg.png"; // URL gambar pipa

bird.image.onload = function() {
  update();  // Mulai game setelah gambar burung dimuat
};

function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bird control
  if (isFlying) {
    bird.velocity += lift;
  }
  bird.velocity += gravity;
  bird.velocity *= 0.9; // drag
  bird.y += bird.velocity;

  if (bird.y + bird.height > canvas.height || bird.y < 0) {
    endGame();
    return;
  }

  // Pipes
  if (frame % 90 === 0) {
    let gap = 120;
    let top = Math.random() * (canvas.height - gap - 100);
    pipes.push({
      x: canvas.width,
      y: top,
      width: 50,
      gap: gap
    });
  }

  for (let i = 0; i < pipes.length; i++) {
    let pipe = pipes[i];
    pipe.x -= 2;

    // Draw pipe using the image
    ctx.drawImage(pipeImage, pipe.x, 0, pipe.width, pipe.y);
    ctx.drawImage(pipeImage, pipe.x, pipe.y + pipe.gap, pipe.width, canvas.height - (pipe.y + pipe.gap));

    if (
      bird.x < pipe.x + pipe.width &&
      bird.x + bird.width > pipe.x &&
      (bird.y < pipe.y || bird.y + bird.height > pipe.y + pipe.gap)
    ) {
      endGame();
      return;
    }

    if (pipe.x + pipe.width < bird.x && !pipe.passed) {
      score++;
      pipe.passed = true;
    }
  }

  pipes = pipes.filter(p => p.x + p.width > 0);

  // Draw bird (menggunakan gambar)
  ctx.drawImage(bird.image, bird.x, bird.y, bird.width, bird.height);

  // Draw score
  ctx.fillStyle = "#000";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);

  frame++;
  requestAnimationFrame(update);
}

function endGame() {
  gameOver = true;
  gameOverSound.play(); // Memainkan suara game over
  alert("Game Over! Skor kamu: " + score);
  location.reload();
}

// Event for button
const button = document.getElementById("tapBtn");
button.addEventListener("touchstart", e => {
  e.preventDefault();
  isFlying = true;
});
button.addEventListener("touchend", e => {
  e.preventDefault();
  isFlying = false;
});
button.addEventListener("mousedown", () => isFlying = true);
button.addEventListener("mouseup", () => isFlying = false);
button.addEventListener("mouseleave", () => isFlying = false);

// Canvas tap for flying
canvas.addEventListener("touchstart", () => isFlying = true);
canvas.addEventListener("touchend", () => isFlying = false);

// Keyboard (optional)
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "ArrowUp") isFlying = true;
});
document.addEventListener("keyup", e => {
  if (e.code === "Space" || e.key === "ArrowUp") isFlying = false;
});
</script>
</body>
</html>
